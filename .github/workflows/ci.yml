name: CI

on:
  pull_request:
    branches: ['**']

# Cancel superseded runs on the same PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Each step below is sequential; a non-zero exit fails the whole job,
      # which blocks the PR.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit & component tests
        run: npm test

      # Preview/CI build: ALLOW_PENDING lets the pipeline run while brief copy is
      # still [PENDING]. The PRODUCTION build (see docs/HANDOVER.md) runs WITHOUT
      # this flag, so unresolved placeholders block a real deploy.
      - name: Build (static export)
        run: ALLOW_PENDING=true npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Accessibility tests
        run: npm run test:a11y

      # Lighthouse budgets (lighthouserc.cjs) — asserts category scores and Core
      # Web Vitals against ./out; a regression past the budgets fails the PR.
      - name: Lighthouse CI
        run: npm run lh

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
