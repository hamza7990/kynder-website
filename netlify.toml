# ⚠️ Vercel is the recommended host for this app (see docs/DEPLOY.md). This file
# is kept as a working Netlify SSR fallback. KYNDER is NO LONGER a static export —
# it is a server-rendered Next.js App Router app with Server Actions and Prisma,
# so the old `output: 'export'` / `publish = "out"` setup does not apply.

[build]
  # Runs DB migrations, then the SSR build. The @netlify/plugin-nextjs plugin
  # handles serving the server-rendered output.
  command = "prisma generate && prisma migrate deploy && next build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--no-audit --no-fund"

# Official Next.js runtime for Netlify (SSR, Server Actions, route handlers).
[[plugins]]
  package = "@netlify/plugin-nextjs"

# ── Security headers (applied to every response) ─────────────────────────────
# NOTE: 'unsafe-inline' is required by Next's inline bootstrap/RSC scripts. When
# a scheduler embed is connected, add its origin to frame-src (replace 'none').
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://plausible.io; connect-src 'self' https://plausible.io; frame-src 'none'; manifest-src 'self'"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    X-Frame-Options = "DENY"

# Hashed build assets are immutable and safe to cache for a year.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
